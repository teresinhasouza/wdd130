<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosco | Companhia de Rafting em Corredeiras</title>
    <meta name="description" content="Conheça a WWR, a melhor opção para aventuras de rafting em corredeiras de tirar o fôlego com total segurança e guias experientes.">
    <meta name="author" content="Teresinha Pereira Matos Souza">
    <link rel="stylesheet" href="estilos/rafting.css">
</head>
<body>
    <header>
        <img src="imagens/rafting.jpg" alt="Logotipo do White water Rafting.">
        <nav>
            <ul>
                <li><a href="index.html">Página Inicial</a></li>
                <li><a href="sobre.html">Sobre Nós</a></li>
                <li><a href="passeios.html">Passeios</a></li>
                <li><a href="contato.html">Fale Conosco</a></li>
            </ul>
        </nav>

    </header>
    <main>
        <h1>Fale Conosco</h1>
        <section class="localizacao"> 
                     
            <p>São Félix do Tocantins, Tocantins</p>
            <p>p>Rua principal, 135</p>
            <p>+55 98 99999-9999</p>
            <p>info@corredeiras.com</p>
                        
        </section>

        <section class="contato">
            <div class="mapa">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d31417.042130347887!2d-46.677253667098014!3d-10.170065409804362!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9331c5ddd8d2ed83%3A0xe626fc174abd7f0d!2sS%C3%A3o%20F%C3%A9lix%20do%20Tocantins%2C%20State%20of%20Tocantins%2C%2077605-000!5e0!3m2!1sen!2sbr!4v1785830626760!5m2!1sen!2sbr"
                width="600" height="450" ;" allowfullscreen="" loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"></iframe>"
            </div>
            <form>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
                <label>Propósito da mensagem:</label>
                <div class="opcoes-radio">
                    <label>
                                   
                        <input type="radio" id="consulta" name="assunto" value="consulta" required>
                        <label for="consulta">Consulta Geral</label>
                    </label>

                    <label>
                        <input type="radio" id="consulta" name="assunto" value="reserva">
                        <label for="reserva">Pergunta sobre Reserva</label>
                    </label>

                    <label>
                        <input type="radio" id="sugestao" name="assunto" value="sugestao">
                        <label for="sugestao">Sugestão de Site</label>
                    </label>
                </div>    

                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="6" required></textarea>

                <label>
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Quero receber a newsletter mensal</label>
                </label>
                <button type="submit">Entrar em Contato</button>
            </form>

        </section>
        <section class="funcionarios">
            <h2>Nossa equipe</h2>

            <div class="equipe">
                <figure>
                    <img src="imagens/guia_de_rafting.webp" alt="Guia de Rafting">
                    <figcaption>Eden Matos - Guia de Rafting</figcaption>
                </figure>

                <figure>
                    <img src="imagens/secretaria.webp" alt="Secretaria Empresa">
                    <figcaption>Luma Melissa - Atendimento ao Cliente</figcaption>
                </figure>

                <figure>
                    <img src="imagens/gerente_de_operacoes.webp" alt="Gerente de operações">
                    <figcaption>Adam Souza - Gerente de Operações </figcaption>
                </figure>
            </div>
               
        </section>
        <section class="contato">

        </section>

    </main>
    <footer>
        <p>&copy; 2026 White Water Rafting - Teresinha Pereira Matos Souza</p>

        <nav class="redes-sociais">
            <a href="https://facebook.com" target="_blank">
                <img src="imagens/facebook.jpg" alt="Ícone do Facebook">
            </a>
            <a href="https://linkedin.com" target="_blank">
                <img src="imagens/linkedin.jpg" alt="Ícone do linkedin">
            </a>
            <a href="https://instagram.com" target="_blank">
                <img src="imagens/instagram.jpg" alt="Ícone do Instagram">
            </a>
        </nav>

    </footer>
</body>
</html>
